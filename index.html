    <script defer>window.LA && LA.init({ id: "3ObNUtNXa4Os8xRM", ck: "3ObNUtNXa4Os8xRM" });</script>
    <script>
      // 渲染前应用 light/dark 主题，避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('oscar-theme');
          var resolved;
          if (t === 'light' || t === 'dark') {
            resolved = t;
          } else {
            // system 或未设置：跟随系统
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* ignore */ }
      })();
      // 渲染前应用 games 主题（classic / arcade），避免闪烁
      (function() {
        try {
          var gt = localStorage.getItem('oscar-games-theme');
          if (gt !== 'classic' && gt !== 'arcade') gt = 'arcade';
          document.documentElement.setAttribute('data-games-theme', gt);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
