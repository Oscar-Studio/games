<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3efe7" />
    <meta
      name="description"
      content="在典藏木棋桌上对弈军棋，选择布阵暗棋或翻棋，挑战电脑或邀请好友。"
    />
    <title>军棋 · Oscar Studio 棋室</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <a href="/">‹　游戏大厅</a
      ><span class="brand">OSCAR STUDIO <i></i> 棋室</span>
      <div id="userButtonContainer"></div>
    </header>
    <main>
      <section class="desk" aria-label="军棋棋桌">
        <div class="player">
          <span class="seal" id="upperSeal">⚑</span><b id="upper"></b
          ><small id="upperState"></small>
        </div>
        <div class="frame"><div id="board" aria-label="棋盘"></div></div>
        <div class="player">
          <span class="seal" id="lowerSeal">⚑</span><b id="lower"></b
          ><small id="lowerState"></small>
        </div>
      </section>
      <aside>
        <div class="heading">
          <div class="emblem" aria-hidden="true">陸<br />戰</div>
          <div>
            <h1>军棋</h1>
            <span class="subtitle">双人陆战棋</span>
          </div>
          <button id="rules" class="rule">玩法说明 ↗</button>
        </div>
        <div class="panel" id="controls"></div>
        <div class="panel" id="feedback">
          <h2>棋桌提示</h2>
          <p id="notice" aria-live="polite"></p>
        </div>
        <details class="panel" id="ledger">
          <summary>对局棋谱 <span id="count"></span></summary>
          <ol id="logs"></ol>
        </details>
      </aside>
    </main>
    <dialog id="modal">
      <div id="dialogContent"></div>
      <button id="close">关闭</button>
    </dialog>
    <script type="module" src="./app.js"></script>
    <script defer src="https://api.oscarstudio.cn/user-button.js"></script>
  </body>
</html>
